[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekh"
version = "2.0.0"
description = "Gap-Bracket: consensus RNA secondary structure prediction with pseudoknots, using the KH-99 grammar, a phylogenetic column model and two-layer CYK"
readme = "README.md"
authors = [{ name = "Ali Ahmadi Esfidi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]
figures = ["matplotlib"]

[project.scripts]
ekh = "ekh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ekh = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
